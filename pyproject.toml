[project]
name = "mango"
version = "0.2.0"
description = "Controle financeiro pessoal — backend (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "cryptography>=42",
    "psycopg[binary]>=3.2",
    "bcrypt>=4.1",
    "pyotp>=2.9",
    "httpx>=0.27",
    "apscheduler>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.16.5",
    "pre-commit>=4.6.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
# Script de descoberta (sandbox, descartável após a Fase 0) — fora do lint.
extend-exclude = ["scripts/discovery", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# A pasta local `alembic/` confunde o isort; fixamos o pacote como third-party.
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
# Padrão do FastAPI: dependências como default de argumento (não são mutáveis de fato).
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = [
    # Deprecação do Starlette/TestClient (httpx) — fora do nosso controle.
    "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = [
    # Dados de seed e migrations não são lógica testável — inflariam o denominador.
    "app/seed/data/*",
    "alembic/*",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
