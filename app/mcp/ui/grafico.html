<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mango — gráfico</title>
<!-- MCP App (docs/mcp.md §3.4): recebe o tool-result da tool `grafico` e desenha a MESMA spec
     Vega-Lite do PNG, agora com tooltip/hover. Libs do jsDelivr (declarado em _meta.ui.csp). -->
<script src="https://cdn.jsdelivr.net/npm/vega@5.30.0/build/vega.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-lite@5.21.0/build/vega-lite.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-embed@6.26.0/build/vega-embed.min.js"></script>
<style>
  :root { color-scheme: light; --fundo: #fcfcfb; --tinta: #52514e; }
  :root[data-tema="dark"] { color-scheme: dark; --fundo: #1a1a19; --tinta: #c3c2b7; }
  html, body { margin: 0; background: var(--fundo); color: var(--tinta);
    font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
  #grafico { width: 100%; }
  #grafico .vega-embed { width: 100%; }
  #aviso { padding: 16px; }
</style>
</head>
<body>
<div id="grafico"></div>
<p id="aviso">Carregando gráfico…</p>
<script>
  // Modo escuro: cada hex do modo claro trocado pelo passo escuro do MESMO papel (skill dataviz,
  // references/palette.md) — selecionado, não invertido. Vale para o config e para marcas de cor
  // fixa (barra única, traço de limite), que trazem o hex direto na spec.
  const CLARO_PARA_ESCURO = {
    "#fcfcfb": "#1a1a19", "#0b0b0b": "#f0efec", "#52514e": "#c3c2b7", "#e1e0d9": "#2c2c2a",
    "#c3c2b7": "#383835", "#2a78d6": "#3987e5", "#eb6834": "#d95926", "#1baf7a": "#199e70",
    "#eda100": "#c98500", "#e87ba4": "#d55181", "#6250d6": "#9085e9", "#e34948": "#e66767",
  };
  const LOCALE = { decimal: ",", thousands: ".", grouping: [3], currency: ["R$ ", ""] };
  let tema = "light", ultimaSpec = null, proximoId = 1;

  function enviar(msg) { window.parent.postMessage({ jsonrpc: "2.0", ...msg }, "*"); }

  async function desenhar() {
    if (!ultimaSpec) return;
    document.documentElement.dataset.tema = tema;
    let json = JSON.stringify(ultimaSpec);
    if (tema === "dark") json = json.replace(/#[0-9a-f]{6}/g, (h) => CLARO_PARA_ESCURO[h] || h);
    const spec = JSON.parse(json);
    spec.width = "container";
    vega.formatLocale(LOCALE);
    await vegaEmbed("#grafico", spec, { actions: false, renderer: "svg" });
    document.getElementById("aviso").hidden = true;
    const r = document.body.getBoundingClientRect();
    enviar({ method: "ui/notifications/size-changed", params: { width: Math.ceil(r.width), height: Math.ceil(r.height) } });
  }

  function aplicarContexto(ctx) {
    if (ctx && (ctx.theme === "dark" || ctx.theme === "light")) tema = ctx.theme;
  }

  window.addEventListener("message", (ev) => {
    const msg = ev.data;
    if (!msg || msg.jsonrpc !== "2.0") return;
    if (msg.id === 1 && msg.result) {          // resposta do ui/initialize
      aplicarContexto(msg.result.hostContext);
      enviar({ method: "ui/notifications/initialized", params: {} });
      return;
    }
    if (msg.method === "ui/notifications/tool-result") {
      const spec = msg.params && msg.params.structuredContent && msg.params.structuredContent.spec;
      if (spec) { ultimaSpec = spec; desenhar(); }
      else document.getElementById("aviso").textContent = "Este resultado não traz um gráfico.";
    } else if (msg.method === "ui/notifications/host-context-changed") {
      aplicarContexto(msg.params); desenhar();
    }
  });

  if (window.matchMedia("(prefers-color-scheme: dark)").matches) tema = "dark";
  enviar({
    id: proximoId++,
    method: "ui/initialize",
    params: { protocolVersion: "2026-01-26", appInfo: { name: "mango-grafico", version: "1" }, appCapabilities: {} },
  });
</script>
</body>
</html>
