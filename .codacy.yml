# Análise estática do Codacy. A cobertura chega pelo CI (ver .github/workflows/ci.yml).
#
# O ruff e o eslint já rodam no CI e barram o merge; aqui o interesse é o que eles não cobrem —
# duplicação, complexidade e segurança. As engines que só repetiriam o lint local ficam desligadas
# para não gerar duas vozes sobre o mesmo problema.
---
engines:
  pylint:
    enabled: true
  bandit:
    enabled: true
  eslint:
    enabled: false # já roda no CI com a config do projeto (frontend/eslint.config.js)
  # Na Codacy cada major do ESLint é um motor próprio, e `enabled` aqui não liga/desliga motor
  # (isso é só pela UI) — o que vale é exclude_paths. Sem isso o ESLint8 roda sem resolução de
  # tipos e gera falsos positivos ("'any' overrides" em tipo local, params de assinatura "unused").
  eslint-8:
    exclude_paths: ["frontend/**"]
  eslint-9:
    exclude_paths: ["frontend/**"]
  # O parser TS do Lizard erra a fronteira de função em JSX (componente de ~50 linhas medido com
  # 297; helper curto com 144). Complexidade de .py/.ts segue valendo.
  lizard:
    exclude_paths: ["frontend/**/*.tsx"]
  pmd:
    enabled: false

exclude_paths:
  # Gerados — não são código autoral.
  - "frontend/dist/**"
  - "frontend/node_modules/**"
  - "frontend/src/lib/api/schema.d.ts"
  - "frontend/openapi.json"
  - "frontend/package-lock.json"
  - "uv.lock"
  # Migrations são geradas pelo alembic e já ficam fora do ruff (ver pyproject.toml).
  - "alembic/versions/**"
  # Sandbox de descoberta, descartável (ver pyproject.toml: extend-exclude).
  - "scripts/discovery/**"
  # Primitivos do shadcn/ui, mantidos como vieram do registro.
  - "frontend/src/components/ui/**"
  - "tests/**"
  - "docs/**"
  # Skills de agente vendoradas (cópia para o Codex do que vive em .claude/) e instruções de
  # agente — não são código do mango. O AGENTS.md cita docs/dev/, que é local (gitignored).
  - ".agents/**"
  - "AGENTS.md"
  # Ferramental do vídeo de apresentação (render/captura), fora do app.
  - "brag-output/**"
