# Postgres de desenvolvimento (opcional, §5.4). SQLite é o padrão de dev — suba isto
# só ao testar paridade de dialeto:  docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mango
      POSTGRES_PASSWORD: mango
      POSTGRES_DB: mango
    ports:
      - "5432:5432"
    volumes:
      - mango_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mango -d mango"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mango_pgdata:
